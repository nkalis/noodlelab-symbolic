[project]
name = "noodlelab-symbolic"
# its own version: plugins are versioned as a whole (see docs/plugins/writing.md)
version = "1.0.0"
description = "Symbolic maths with SymPy: equations solved, simplified, differentiated and integrated with units"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nicolas Kalis" }]
dependencies = [
    "noodlelab>=0.2.2.dev0,<1",
    "numpy>=1.26",
    "sympy>=1.12",
]

[project.urls]
Homepage = "https://github.com/nkalis/noodlelab-symbolic"
Documentation = "https://nkalis.github.io/noodlelab/"

# how noodlelab finds it; the name is the prefix of its node ids (symbolic.<node>)
[project.entry-points."noodlelab.nodes"]
symbolic = "noodlelab_symbolic"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noodlelab_symbolic"]
